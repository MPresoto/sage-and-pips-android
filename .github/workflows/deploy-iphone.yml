name: Deploy Sage & Pips iPhone app
on:
  push:
    branches: [ main ]
    paths:
      - 'iphone/**'
      - '.github/workflows/deploy-iphone.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: iphone
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

